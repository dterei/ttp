name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # /bin/bash is bash 5 on Ubuntu and bash 3.2 on macOS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            command -v gpg || brew install gnupg
            brew install oath-toolkit
          else
            sudo apt-get update
            sudo apt-get install -y oathtool
          fi
      - name: Run tests
        run: /bin/bash test/run-tests.sh

  bash-versions:
    name: bash ${{ matrix.bash }}
    strategy:
      fail-fast: false
      matrix:
        bash: ['3.2', '4.0', '4.2', '4.4', '5.0', '5.1', '5.2', '5.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run tests in the official bash ${{ matrix.bash }} image
        run: |
          docker run --rm -v "$PWD:/src" -w /src bash:${{ matrix.bash }} sh -c '
            apk add --no-cache gnupg oath-toolkit-oathtool > /dev/null &&
            bash test/run-tests.sh'

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck
        run: shellcheck ttp test/run-tests.sh
